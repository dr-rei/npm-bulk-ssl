[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "npm-bulk-ssl"
dynamic = ["version"]
description = "Bulk-change the SSL certificate of Nginx Proxy Manager hosts from a searchable, sortable, multi-select terminal UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dr.Rei" }]
keywords = ["nginx-proxy-manager", "npm", "ssl", "tls", "certificates", "tui", "textual"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "textual>=8.0,<9",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
npm-bulk-ssl = "npm_bulk_ssl.cli:main"

[project.urls]
Homepage = "https://github.com/dr-rei/npm-bulk-ssl"
Issues = "https://github.com/dr-rei/npm-bulk-ssl/issues"

[tool.hatch.version]
path = "src/npm_bulk_ssl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/npm_bulk_ssl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
